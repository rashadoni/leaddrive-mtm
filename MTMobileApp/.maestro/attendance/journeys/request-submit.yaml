appId: com.leaddrive.attendance
name: Employee submits one dated request for HR review
---
- runFlow: ../shared/open-fixture.yaml
- assertTrue: ${/^maestro-[a-z0-9-]+$/.test(RUN_ID)}
# Avoid brace quantifiers inside Maestro's ${...} expression parser.
- assertTrue: ${/^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/.test(REQUEST_DATE)}
- tapOn:
    id: time-tab-OwnRequests
- extendedWaitUntil:
    visible:
      id: attendance-new
    timeout: 30000
- tapOn:
    id: attendance-new
- scrollUntilVisible:
    element:
      id: attendance-kind-REMOTE_WORK
    direction: DOWN
    timeout: 60000
- tapOn:
    id: attendance-kind-REMOTE_WORK
- scrollUntilVisible:
    element:
      id: attendance-startDate
    direction: DOWN
    timeout: 60000
- tapOn:
    id: attendance-startDate
    point: "95%,50%"
- eraseText: 100
- inputText: ${REQUEST_DATE}
- hideKeyboard
- assertVisible:
    id: attendance-startDate
    text: ${REQUEST_DATE}
- scrollUntilVisible:
    element:
      id: attendance-endDate
    direction: DOWN
    timeout: 60000
- tapOn:
    id: attendance-endDate
    point: "95%,50%"
- eraseText: 100
- inputText: ${REQUEST_DATE}
- hideKeyboard
- assertVisible:
    id: attendance-endDate
    text: ${REQUEST_DATE}
- scrollUntilVisible:
    element:
      id: attendance-reason
    direction: DOWN
    timeout: 60000
- tapOn:
    id: attendance-reason
- inputText: ${RUN_ID}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: attendance-submit
    direction: DOWN
    timeout: 60000
- tapOn:
    id: attendance-submit
- extendedWaitUntil:
    notVisible:
      id: attendance-form
    timeout: 60000
# Closing the long form retains its scroll offset. Return above the newest row.
- scrollUntilVisible:
    element:
      id: attendance-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: attendance-refresh
- scrollUntilVisible:
    element:
      text: ${RUN_ID}
      id: attendance-request-reason-.*
    direction: DOWN
    timeout: 60000
- assertVisible:
    text: ${RUN_ID}
    id: attendance-request-reason-.*
