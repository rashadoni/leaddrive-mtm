appId: com.leaddrive.attendance
name: Previously authenticated employee retains workday access after offline cold start
# Run only through a host harness that restores the exact Wi-Fi/mobile-data state.
# Requires a successful online admission within the last 24 hours.
---
- stopApp
- launchApp:
    clearState: false
    permissions:
      android.permission.CAMERA: deny
      android.permission.ACCESS_FINE_LOCATION: deny
      android.permission.ACCESS_COARSE_LOCATION: deny
- extendedWaitUntil:
    visible:
      id: time-tab-OwnWorkday
    timeout: 30000
- tapOn:
    id: time-tab-OwnWorkday
- assertVisible: "Fictional office employee"
- assertNotVisible:
    id: office-workday-unavailable
- assertNotVisible:
    id: login-email
- assertVisible:
    id: office-workday-offline
