appId: com.leaddrive.attendance
name: Return to an existing fictional day and retain canonical delivery receipts
---
# Supplementary receipt acceptance; this does not replace a fresh-day START test.
- runFlow: ../shared/open-fixture.yaml
- assertVisible: ${output.copy.completed}
- assertNotVisible:
    id: office-workday-pending
- scrollUntilVisible:
    element:
      id: office-workday-return
    direction: DOWN
    timeout: 60000
- tapOn:
    id: office-workday-return
    enabled: true
- extendedWaitUntil:
    visible: ${output.copy.running}
    timeout: 60000
- scrollUntilVisible:
    element:
      id: office-workday-break
    direction: DOWN
    timeout: 60000
- tapOn:
    id: office-workday-break
    enabled: true
# Wait for the operation to finish before killing the app; restart must retain PAUSE.
- extendedWaitUntil:
    visible:
      id: office-workday-break
      enabled: true
    timeout: 60000
- stopApp
- runFlow: ../shared/open-fixture.yaml
- assertVisible: ${output.copy.paused}
- scrollUntilVisible:
    element:
      id: office-workday-break
    direction: DOWN
    timeout: 60000
- tapOn:
    id: office-workday-break
    enabled: true
- scrollUntilVisible:
    element:
      id: office-workday-action
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: office-workday-action
      enabled: true
    timeout: 60000
- tapOn:
    id: office-workday-action
    enabled: true
- assertVisible: ${output.copy.finishTitle}
- tapOn:
    id: app-choice-button-1
- runFlow:
    when:
      visible:
        id: ".*:id/permission_deny(_and_dont_ask_again)?_button"
    commands:
      - tapOn:
          id: ".*:id/permission_deny(_and_dont_ask_again)?_button"
- scrollUntilVisible:
    element:
      text: ${output.copy.completed}
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: office-workday-pending
    timeout: 60000
- stopApp
- runFlow: ../shared/open-fixture.yaml
- assertVisible: ${output.copy.completed}
- assertNotVisible:
    id: office-workday-pending
- scrollUntilVisible:
    element:
      id: attendance-receipt-received
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: attendance-receipt-received
