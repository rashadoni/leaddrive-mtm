appId: com.leaddrive.attendance
name: Record a fresh GPS finish with previously accepted consent and OS permission
# Explicit current-day REOPEN/FINISH; host verifies ownership and HR evidence.
---
- runScript: ../shared/labels.js
- launchApp:
    clearState: false
    permissions:
      android.permission.CAMERA: deny
      android.permission.ACCESS_FINE_LOCATION: allow
      android.permission.ACCESS_COARSE_LOCATION: allow
- extendedWaitUntil:
    visible:
      id: time-tab-OwnWorkday
    timeout: 45000
- tapOn:
    id: time-tab-OwnWorkday
- assertVisible: "Fictional office employee"
- assertVisible: ${output.copy.completed}
- assertNotVisible:
    id: office-workday-pending
- scrollUntilVisible:
    element:
      id: office-workday-return
    direction: DOWN
    timeout: 60000
- tapOn:
    id: office-workday-return
- scrollUntilVisible:
    element:
      text: ${output.copy.running}
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element:
      id: office-workday-action
    direction: DOWN
    timeout: 60000
- tapOn:
    id: office-workday-action
- tapOn:
    id: app-choice-button-1
- scrollUntilVisible:
    element:
      text: ${output.copy.completed}
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: office-workday-pending
    timeout: 60000
- assertNotVisible:
    id: office-workday-conflict
