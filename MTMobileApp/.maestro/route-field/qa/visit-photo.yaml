appId: com.mtmobileapp
name: Capture one real camera photo for the marked QA active visit
---
- assertTrue: ${RF_QA_PREFLIGHT === 'zeytun-owner-selected-qa-v1'}
- runScript: ../shared/labels.js
- runScript: ../shared/qa-labels.js
- runFlow: ../shared/open-fixture-visits.yaml
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.active}
    direction: UP
    timeout: 45000
- assertVisible: ${RF_QA_CUSTOMER_NAME}
- assertVisible: ${output.qa.visit.zeroPhotos}
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.addPhoto}
    direction: DOWN
    timeout: 15000
- tapOn: ${output.qa.visit.addPhoto}
# Capture is never replaced by a generated/gallery image. Permission admission
# is scoped to this fixture camera; original flags are recorded by the driver.
- runFlow:
    when:
      visible: ${output.qa.photoPermissionBody}
    commands:
      - tapOn: ${output.qa.photoAllow}
- runFlow:
    when:
      visible:
        id: com.google.android.permissioncontroller:id/permission_allow_foreground_only_button
    commands:
      - tapOn:
          id: com.google.android.permissioncontroller:id/permission_allow_foreground_only_button
- runFlow:
    when:
      visible:
        id: com.android.permissioncontroller:id/permission_allow_foreground_only_button
    commands:
      - tapOn:
          id: com.android.permissioncontroller:id/permission_allow_foreground_only_button
- extendedWaitUntil:
    visible: ${output.qa.photoCapture}
    timeout: 20000
- tapOn: ${output.qa.photoCapture}
- extendedWaitUntil:
    visible: ${output.qa.photoUse}
    timeout: 30000
- tapOn: ${output.qa.photoUse}
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.onePhoto}
    direction: UP
    timeout: 45000
- tapOn: ${output.copy.profileBack}
- tapOn:
    id: guide-spot-tab.Today
