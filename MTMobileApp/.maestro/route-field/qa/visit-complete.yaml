appId: com.mtmobileapp
name: Save the marked QA visit completion while RF UID is offline
---
- assertTrue: ${RF_QA_PREFLIGHT === 'zeytun-owner-selected-qa-v1'}
- runScript: ../shared/labels.js
- runScript: ../shared/qa-labels.js
- runFlow: ../shared/open-fixture-visits.yaml
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.active}
    direction: UP
    timeout: 45000
- assertVisible: ${RF_QA_CUSTOMER_NAME}
- assertVisible: ${output.qa.visit.onePhoto}
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.finish}
    direction: DOWN
    timeout: 15000
- tapOn: ${output.qa.visit.finish}
- tapOn: ${output.qa.notesPlaceholder}
- inputText: RF-QA marked QA visit completed
# Android Back can cancel this modal when Maestro has already hidden the IME.
# Its scrollable card keeps the action reachable while the field has focus.
- scrollUntilVisible:
    element:
      text: ${output.qa.notesSubmit}
    direction: DOWN
    timeout: 15000
- tapOn: ${output.qa.notesSubmit}
# The driver records UI only. The orchestrator must separately prove either
# pending persistence while UID-blocked or exact canonical completion online.
- extendedWaitUntil:
    notVisible: ${output.qa.notesPlaceholder}
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.waitingSync}
    direction: UP
    timeout: 45000
- tapOn: ${output.copy.profileBack}
- tapOn:
    id: guide-spot-tab.Today
