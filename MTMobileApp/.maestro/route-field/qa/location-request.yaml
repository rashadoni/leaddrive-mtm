appId: com.mtmobileapp
name: Submit the real device position for the marked QA GPS place
---
- assertTrue: ${RF_QA_PREFLIGHT === 'zeytun-owner-selected-qa-v1'}
- runScript: ../shared/labels.js
- runScript: ../shared/qa-labels.js
- tapOn:
    id: guide-spot-tab.More
- runFlow:
    when:
      visible: ${output.copy.profileBack}
    commands:
      - tapOn: ${output.copy.profileBack}
- scrollUntilVisible:
    element:
      id: more-action-Visits
    direction: DOWN
    timeout: 15000
- tapOn:
    id: more-action-Visits
- tapOn: ${output.qa.visit.search}
- inputText: ${RF_QA_CUSTOMER_NAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ${RF_QA_CUSTOMER_NAME}
      below: ${output.qa.visit.results}
    direction: DOWN
    timeout: 15000
- tapOn:
    text: ${RF_QA_CUSTOMER_NAME}
    below: ${output.qa.visit.results}
- scrollUntilVisible:
    element:
      text: ${output.qa.visit.start}
    direction: DOWN
    timeout: 15000
- tapOn: ${output.qa.visit.start}
- tapOn: ${output.qa.checkIn}
- assertVisible: ${output.qa.noCoordinates}
- assertVisible: ${output.qa.customerHere}
- tapOn:
    id: app-choice-button-1
# Never scroll this non-scrollable screen: a swipe would pan its map.
# No map gesture or synthetic coordinate is used: the pin begins at the
# actual foreground fix and the app/server enforce freshness and accuracy.
- assertVisible: ${output.qa.location.title}
- extendedWaitUntil:
    visible:
      id: location-fix-send
      enabled: true
    timeout: 45000
- tapOn: ${output.qa.location.comment}
- inputText: RF-QA marked QA device GPS acceptance
- hideKeyboard
- tapOn:
    id: location-fix-send
- extendedWaitUntil:
    visible: ${output.qa.location.sent}
    timeout: 30000
- tapOn: OK
- tapOn: ${output.copy.profileBack}
- tapOn:
    id: guide-spot-tab.Today
