appId: com.mtmobileapp
name: Switch only to the separately owned fictional Route Field employee
---
- assertTrue: ${RF_FIXTURE_PREFLIGHT === 'separate-owned-route-field-v1'}
- runScript: ../shared/labels.js
- runScript: ../shared/fixture-labels.js
- tapOn:
    id: guide-spot-tab.More
# The manager More tab is Profile itself, unlike the employee More menu.
- scrollUntilVisible:
    element:
      text: ${output.fixture.priorName}
    direction: UP
    timeout: 15000
- assertVisible: ${output.fixture.priorName}
- assertVisible: ${output.fixture.priorEmail}
- scrollUntilVisible:
    element:
      text: ${output.fixture.switchCompany}
    direction: DOWN
    timeout: 15000
- tapOn: ${output.fixture.switchCompany}
- tapOn:
    text: ${output.fixture.switchConfirm}
    below: ${output.fixture.switchMessage}
- extendedWaitUntil:
    visible:
      id: tenant-input
    timeout: 30000
- tapOn:
    id: tenant-input
- eraseText
- inputText: route-field-acceptance
- scrollUntilVisible:
    element:
      id: tenant-continue
    direction: DOWN
    timeout: 15000
- tapOn:
    id: tenant-continue
- extendedWaitUntil:
    visible:
      id: login-tab-signin
    timeout: 45000
- runFlow: ../shared/fixture-auth.yaml
