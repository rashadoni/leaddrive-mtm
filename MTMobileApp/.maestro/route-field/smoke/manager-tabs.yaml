appId: com.mtmobileapp
name: Field manager reads the team and planning without publishing or messaging
---
- assertTrue: ${RF_MANAGER_PREFLIGHT === 'owner-verified-manager-readonly-v1'}
- runScript: ../shared/labels.js
- runScript: ../shared/manager-labels.js
- tapOn:
    id: guide-spot-tab.Team
- scrollUntilVisible:
    element:
      id: manager-today-tiles
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      id: ${'manager-agent-card-' + RF_AGENT_ID}
    direction: DOWN
    timeout: 30000
- tapOn:
    id: ${'manager-agent-card-' + RF_AGENT_ID}
- extendedWaitUntil:
    visible:
      id: manager-employee-give-task
    timeout: 30000
- assertVisible: ${output.managerAgentName}
- tapOn:
    id: manager-employee-give-task
- assertVisible:
    id: manager-task-sheet
- tapOn:
    id: manager-task-due-none
# Empty title exercises local validation only: no task may be sent.
- tapOn:
    id: manager-task-send
- assertVisible: ${output.managerTaskRequired}
# Intentionally cancel: one BACK may dismiss the IME before the modal.
- back
- runFlow:
    when:
      visible:
        id: manager-task-sheet
    commands:
      - back
- assertNotVisible:
    id: manager-task-sheet
- tapOn:
    id: manager-employee-back
- tapOn:
    id: guide-spot-tab.Planning
- extendedWaitUntil:
    visible:
      id: planning-agent-open
    timeout: 30000
- assertVisible:
    id: planning-summary-routes
- tapOn:
    id: planning-agent-open
- assertVisible:
    id: planning-agent-sheet
- back
- assertNotVisible:
    id: planning-agent-sheet
- tapOn:
    id: guide-spot-tab.Approvals
- assertNotVisible:
    id: login-email
- tapOn:
    id: guide-spot-tab.More
- assertVisible: ${output.managerName}
- assertVisible: ${output.managerEmail}
- tapOn:
    id: guide-spot-tab.Team
- scrollUntilVisible:
    element:
      id: manager-today-tiles
    direction: UP
    timeout: 15000
- assertVisible:
    id: manager-today-tiles
