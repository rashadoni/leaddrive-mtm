          <div class="at-identity"><span class="at-avatar">ЛМ</span><div><h3>Лейла Мамедова</h3><p>Сотрудник</p><p class="at-muted">Центральный филиал</p></div></div>
          <h4>Личные настройки</h4><div class="at-settings"><button type="button" class="at-setting cursor-interaction" data-open="language" aria-expanded="false"><i data-lucide="languages" aria-hidden="true"></i><span class="at-grow">Язык<span class="at-muted" data-language>Русский</span></span><i data-lucide="chevron-right" aria-hidden="true"></i></button><div class="at-detail" data-detail="language" hidden><label class="at-label">Язык приложения<select name="language"><option>Русский</option><option>Azərbaycan</option><option>English</option></select></label></div><label class="at-setting"><i data-lucide="circle-help" aria-hidden="true"></i><span class="at-grow">Подсказки<span class="at-muted">Короткая помощь по месту</span></span><span class="at-check"><input type="checkbox" name="hints" aria-label="Показывать подсказки" checked></span></label></div>
          <h4>Устройство и приватность</h4><div class="at-settings"><button type="button" class="at-setting cursor-interaction" data-open="device" aria-expanded="false"><i data-lucide="smartphone" aria-hidden="true"></i><span class="at-grow">Этот телефон<span class="at-muted">Допущен кадровиком</span></span><i data-lucide="chevron-right" aria-hidden="true"></i></button><div class="at-detail" data-detail="device" hidden>Если организация требует допуск, новый телефон подтверждает администратор. Доступ показывается для текущего аккаунта и устройства.</div><button type="button" class="at-setting cursor-interaction" data-open="privacy" aria-expanded="false"><i data-lucide="map-pin" aria-hidden="true"></i><span class="at-grow">Геолокация<span class="at-muted">Согласие принято · на телефоне выключено</span></span><i data-lucide="chevron-right" aria-hidden="true"></i></button><div class="at-detail at-stack" data-detail="privacy" hidden><p>Согласие организации и разрешение телефона показываются отдельно. Место проверяется при отметке, фонового отслеживания нет.</p><p class="at-muted">В приложении здесь открываются утверждённый текст и отдельное действие отзыва согласия. Эскиз не меняет разрешения.</p></div></div>

      <div class="at-panel at-flash" role="status" aria-live="polite" data-live hidden></div>
      <nav class="at-tabs" role="tablist" aria-label="Основные вкладки"><button type="button" class="cursor-interaction" data-go="day" role="tab" aria-selected="true"><i data-lucide="clock-3" aria-hidden="true"></i>День</button><button type="button" class="cursor-interaction" data-go="requests" role="tab" aria-selected="false"><i data-lucide="calendar-days" aria-hidden="true"></i>Заявки</button><button type="button" class="cursor-interaction" data-go="replies" role="tab" aria-selected="false"><i data-lucide="message-circle" aria-hidden="true"></i>Ответы</button><button type="button" class="cursor-interaction" data-go="inbox" role="tab" aria-selected="false"><i data-lucide="bell" aria-hidden="true"></i>Входящие</button><button type="button" class="cursor-interaction" data-go="profile" role="tab" aria-selected="false"><i data-lucide="user-round" aria-hidden="true"></i>Профиль</button></nav>
    </article>
  </template>
</div>
<script>
(function(){
  const root=document.getElementById('attendance-all-tabs');
  const saved=window.openai?.widgetState||{};
  const models={},renders={};
  const template=root.querySelector('#at-app-template');
  function persist(){
    const choices={};Object.keys(models).forEach(key=>{const m=models[key];choices[key]={tab:m.tab,state:m.state,spacing:m.spacing,offline:m.offline};});
    window.openai?.setWidgetState?.({modelContent:{attendanceDesigns:choices},privateContent:null})?.catch(()=>{});
  }
  root.querySelectorAll('[data-design]').forEach(mount=>{
    const id=mount.dataset.design;
    const initial=saved.modelContent?.attendanceDesigns?.[id]||{};
    const model=models[id]={tab:['day','requests','replies','inbox','profile'].includes(initial.tab)?initial.tab:'day',state:['Работа','Перерыв','Завершён'].includes(initial.state)?initial.state:'Работа',spacing:initial.spacing==='Свободнее'?'Свободнее':'Компактно',offline:initial.offline===true};
    const fragment=template.content.cloneNode(true);mount.append(fragment);
    const app=mount.querySelector('.at-phone');if(id==='quiet')app.classList.add('at-quiet');
    app.setAttribute('aria-label',id==='rhythm'?'Ритм: пять вкладок':'Спокойный: пять вкладок');
    let dialogAction=null;
    const q=selector=>app.querySelector(selector);
    const qa=selector=>app.querySelectorAll(selector);
    function flash(text){q('[data-live]').hidden=false;q('[data-live]').textContent=text;}
    function render(){
      app.style.setProperty('--at-space',model.spacing==='Свободнее'?'20px':'14px');
      qa('[data-panel]').forEach(panel=>{panel.hidden=panel.dataset.panel!==model.tab;panel.id=`at-${id}-${panel.dataset.panel}`;panel.setAttribute('aria-labelledby',`at-${id}-tab-${panel.dataset.panel}`);});
      qa('.at-tabs [data-go]').forEach(button=>{button.id=`at-${id}-tab-${button.dataset.go}`;button.setAttribute('aria-controls',`at-${id}-${button.dataset.go}`);button.setAttribute('aria-selected',String(button.dataset.go===model.tab));});
      const finished=model.state==='Завершён',paused=model.state==='Перерыв';
      q('[data-day-title]').textContent=finished?'Рабочий день завершён':paused?'Вы на перерыве':'Вы на работе';
      q('[data-day-badge]').textContent=finished?'Завершён':paused?'Перерыв':'День идёт';
      q('[data-day-copy]').textContent=finished?'Отметка сохранена в эскизе':paused?'Начало в 09:03 · сейчас перерыв':'Начало в 09:03 · перерыв 30 минут';
      q('[data-pause-copy]').textContent=finished?'Вернуться к работе':paused?'Продолжить':'На перерыв';
      q('[data-scan-copy]').textContent=finished?'QR доступен при начале и завершении':paused?'QR недоступен во время перерыва':'Завершить по QR';
      q('[data-act="scan"]').disabled=finished||paused||model.offline;
      q('[data-act="pause"]').disabled=finished&&model.offline;
      q('[data-act="finish"]').hidden=finished;
      q('[data-offline]').hidden=!model.offline;
      q('[data-delivery-label]').textContent=model.offline?'Ждёт доставки · сохранено на телефоне':'Все отметки доставлены';
    }
    function go(tab){model.tab=tab;q('[data-dialog]').hidden=true;q('[data-live]').hidden=true;render();persist();}
    function openDialog(kind,title,copy){dialogAction=kind;q('[data-dialog-title]').textContent=title;q('[data-dialog-copy]').textContent=copy;qa('[data-panel]').forEach(p=>p.hidden=true);q('[data-dialog]').hidden=false;}
    function filterInbox(unread){
      let count=0;qa('[data-notice]').forEach(row=>{row.hidden=unread&&row.dataset.unread!=='true';if(!row.hidden)count++;});
      const headings=qa('[data-panel="inbox"] .at-section');headings[0].hidden=q('[data-notice="answer"]').hidden&&q('[data-notice="request"]').hidden;headings[1].hidden=q('[data-notice="phone"]').hidden;
      let empty=q('[data-inbox-empty]');if(!empty){empty=document.createElement('p');empty.dataset.inboxEmpty='';empty.className='at-muted';empty.textContent='Нет непрочитанных уведомлений';q('[data-panel="inbox"]').append(empty);}empty.hidden=count>0;
    }
    app.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.go){go(button.dataset.go);return;}
      if(button.dataset.open){const block=q(`[data-detail="${button.dataset.open}"]`);if(!block)return;block.hidden=!block.hidden;button.setAttribute('aria-expanded',String(!block.hidden));return;}
      if(button.dataset.requestFilter){const filter=button.dataset.requestFilter;qa('[data-request-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));qa('[data-request-item]').forEach(row=>row.hidden=filter!=='all'&&row.dataset.requestItem!==filter);return;}
      if(button.dataset.inboxFilter){const unread=button.dataset.inboxFilter==='unread';qa('[data-inbox-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));filterInbox(unread);return;}
      if(button.dataset.read){const row=button.closest('[data-notice]');row.dataset.unread='false';row.querySelector('.at-dot')?.remove();row.querySelector('.at-muted').textContent='Опоздание 21 октября · прочитано';button.hidden=true;filterInbox(q('[data-inbox-filter="unread"]').getAttribute('aria-pressed')==='true');flash('В эскизе уведомление отмечено прочитанным');persist();return;}
      switch(button.dataset.act){
        case 'pause':model.state=model.state==='Работа'?'Перерыв':'Работа';render();persist();break;
        case 'finish':openDialog('finish','Завершить рабочий день?','Время и доставка отметки будут показаны отдельно. Здесь изменится только эскиз.');break;
        case 'scan':flash('В приложении откроется камера. В эскизе камера не используется.');break;
        case 'confirm-dialog':if(dialogAction==='finish')model.state='Завершён';q('[data-dialog]').hidden=true;render();flash(dialogAction==='finish'?'Завершение показано в эскизе':'Выход в эскизе не выполняется');persist();break;
        case 'cancel-dialog':q('[data-dialog]').hidden=true;render();break;
        case 'load-evidence':q('[data-evidence]').hidden=false;break;
        case 'new-request':q('[data-compose="request"]').hidden=false;q('[data-request-step="input"]').hidden=false;q('[data-request-step="review"]').hidden=true;break;
        case 'close-request':q('[data-compose="request"]').hidden=true;break;
        case 'review-request':{
          const from=q('[name="from"]').value,to=q('[name="to"]').value,reason=q('[name="reason"]').value.trim();
          if(!from||!to||to<from||reason.length<3){q('[data-request-error]').hidden=false;break;}
          q('[data-request-error]').hidden=true;q('[data-request-summary]').textContent=`${q('[name="kind"]').value} · ${from} — ${to}. ${reason}`;q('[data-request-step="input"]').hidden=true;q('[data-request-step="review"]').hidden=false;break;
        }
        case 'edit-request':q('[data-request-step="input"]').hidden=false;q('[data-request-step="review"]').hidden=true;break;
        case 'demo-request':q('[data-compose="request"]').hidden=true;flash('Демонстрационный черновик готов. Кадровику ничего не отправлено.');break;
        case 'answer':q('[data-compose="answer"]').hidden=false;break;
        case 'close-answer':q('[data-compose="answer"]').hidden=true;break;
        case 'demo-answer':if(q('[name="answer"]').value.trim().length<3){q('[data-answer-error]').hidden=false;break;}q('[data-answer-error]').hidden=true;q('[data-compose="answer"]').hidden=true;flash('Ответ подготовлен в эскизе. Отправка не выполнялась.');break;
        case 'voluntary-answer':flash('В приложении здесь будет список дней, которые можно пояснить.');break;
        case 'logout-demo':openDialog('logout','Выйти из аккаунта?','Сохранённые отметки не удаляются. В эскизе выход не выполняется.');break;
      }
    });
    app.addEventListener('change',event=>{if(event.target.name==='language'){q('[data-language]').textContent=event.target.value;flash('Выбран язык в эскизе; тексты приложения здесь не переводятся.');}persist();});
    renders[id]=render;render();
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{render();persist();}});tweak.addSelect(model,'spacing',{label:'Плотность',options:['Компактно','Свободнее']});tweak.addSelect(model,'state',{label:'Рабочий день',options:['Работа','Перерыв','Завершён']});tweak.addToggle(model,'offline',{label:'Нет интернета'});}
  });
  if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
  window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.modelContent?.attendanceDesigns;if(!state)return;Object.keys(models).forEach(key=>{const next=state[key];if(!next)return;const model=models[key];if(['day','requests','replies','inbox','profile'].includes(next.tab))model.tab=next.tab;if(['Работа','Перерыв','Завершён'].includes(next.state))model.state=next.state;if(['Компактно','Свободнее'].includes(next.spacing))model.spacing=next.spacing;if(typeof next.offline==='boolean')model.offline=next.offline;renders[key]();});});
})();
</script>
