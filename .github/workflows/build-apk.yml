name: Build Android APK

# Builds the MTMobileApp release APK and publishes it as a workflow artifact.
# Signing: if the MTM_RELEASE_KEYSTORE_B64 secret is set (base64 of
# mtm-release.keystore), the APK is signed with the real release key and can
# update existing installs. Without the secret, build.gradle falls back to the
# debug keystore — the APK installs fine but CANNOT update an install signed
# with the release key (uninstall/reinstall required).

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "MTMobileApp/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "MTMobileApp/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: MTMobileApp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether APK build is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -qvE '^(MTMobileApp/__tests__/|MTMobileApp/docs/|MTMobileApp/.*\.(md|mdx)$|\.github/workflows/build-apk\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MTMobileApp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.build == 'true'

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run tests
        run: npx jest --ci

      - name: Materialize release keystore (optional)
        if: steps.scope.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MTM_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/mtm-release.keystore
            echo "Release keystore materialized — APK will be release-signed."
          else
            echo "No MTM_RELEASE_KEYSTORE_B64 secret — falling back to debug signing."
            echo "::warning::APK will be DEBUG-signed: it installs, but cannot update an existing release-signed install."
          fi

      - name: Build release APK
        if: steps.scope.outputs.build == 'true'
        working-directory: MTMobileApp/android
        run: ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace

      - name: Rename APK with version
        if: steps.scope.outputs.build == 'true'
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="leaddrive-mtm-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.build == 'true'
        with:
          name: leaddrive-mtm-apk-v${{ steps.apk.outputs.version }}
          path: MTMobileApp/${{ steps.apk.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      # Artifact downloads require an authenticated Actions UI session; a
      # prerelease gives a plain downloadable asset URL instead.
      - name: Publish APK to GitHub prerelease
        if: github.event_name != 'pull_request' && steps.scope.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}-build${{ github.run_number }}"
          gh release create "$TAG" --prerelease \
            --title "MTM App ${TAG}" \
            --notes "CI build of ${GITHUB_SHA} (branch ${GITHUB_REF_NAME})" \
            --target "${GITHUB_SHA}" || true
          gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --clobber
