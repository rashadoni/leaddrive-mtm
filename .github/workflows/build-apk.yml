name: Build Android APK

# Builds the MTMobileApp release APK and publishes it as a workflow artifact.
# Signing is fail-closed: a release is never produced with the debug key.
# This guarantees that every published APK can update an existing production
# install instead of failing with Android's "invalid package" message.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "MTMobileApp/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "MTMobileApp/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: MTMobileApp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether APK build is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -qvE '^(MTMobileApp/__tests__/|MTMobileApp/docs/|MTMobileApp/.*\.(md|mdx)$|\.github/workflows/build-apk\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MTMobileApp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.build == 'true'

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run tests
        run: npx jest --ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Materialize required release keystore
        if: steps.scope.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MTM_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::MTM_RELEASE_KEYSTORE_B64 is required. Refusing to publish a debug-signed release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mtm-release.keystore
          chmod 600 android/app/mtm-release.keystore
          test -s android/app/mtm-release.keystore

      - name: Build release APK
        if: steps.scope.outputs.build == 'true'
        working-directory: MTMobileApp/android
        run: ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace

      - name: Rename APK with version
        if: steps.scope.outputs.build == 'true'
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -n 1)
          test -n "$VERSION_CODE"
          OUT="leaddrive-mtm-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Verify package, version and release signature
        if: steps.scope.outputs.build == 'true'
        env:
          APK_FILE: ${{ steps.apk.outputs.file }}
          EXPECTED_VERSION: ${{ steps.apk.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"
          BADGING=$("$AAPT" dump badging "$APK_FILE" | head -n 1)
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -q "name='com.mtmobileapp'"
          printf '%s\n' "$BADGING" | grep -q "versionName='$EXPECTED_VERSION'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"

          # Pin the update path to the release signing certificate. A different
          # key makes Android refuse an in-place update, and the agents in the
          # field would have to uninstall and lose their local state.
          #
          # This used to compare against a previously published release. After
          # the move to this account there are no releases to compare with, so
          # the gate failed on a perfectly correct APK ("release not found") and
          # blocked every build. Falling back to "no previous release, therefore
          # fine" would have disarmed the gate exactly when a swapped keystore
          # would slip through, so the expected fingerprint is named here
          # instead — it stays a real check with nothing to download.
          #
          # Provenance: printed by this workflow on run 34362456460 from
          # /home/rashad/.leaddrive-keys/mtm-release.keystore, the key that
          # signs production (CN=LeadDrive MTM, OU=Mobile, O=LeadDrive, L=Baku).
          # Confirmed 2026-09-10 against the installed base, which is the only
          # source that proves what a phone will accept: com.mtmobileapp
          # versionCode 42 / 3.0.4 was pulled off the owner's device with
          # `adb pull` and its APK Signing Block v2 parsed directly. Same
          # certificate, so a build from here installs over it and the agent
          # keeps the queue and drafts that have not synced yet.
          EXPECTED_CERT=d6e9a6a76bb7c12e0ed81e2094f56e356e6f0d12b07ba35a2ed6598a88cecf2b
          # Android build-tools 36 labels the signer as "V2 Signer" while
          # older versions use "Signer #1 certificate". Both forms identify
          # the same signing certificate, so accept either stable output.
          CERT_DIGEST='s/^(Signer #[0-9]+ certificate|V[0-9.]+ Signer: certificate) SHA-256 digest: //p'
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$APK_FILE" | sed -nE "$CERT_DIGEST" | head -n 1)
          test -n "$NEW_CERT"
          if [ "$NEW_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK signed with $NEW_CERT, expected $EXPECTED_CERT — this build cannot update an installed app"
            exit 1
          fi
          printf 'Release certificate SHA-256: %s\n' "$NEW_CERT"
          sha256sum "$APK_FILE" | tee "$APK_FILE.sha256"

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.build == 'true'
        with:
          name: leaddrive-mtm-apk-v${{ steps.apk.outputs.version }}
          path: |
            MTMobileApp/${{ steps.apk.outputs.file }}
            MTMobileApp/${{ steps.apk.outputs.file }}.sha256
          retention-days: 30
          if-no-files-found: error

      # Artifact downloads require an authenticated Actions UI session; a
      # prerelease gives a plain downloadable asset URL instead.
      - name: Publish APK to GitHub prerelease
        if: github.event_name != 'pull_request' && steps.scope.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}-build${{ github.run_number }}"
          SHA256=$(cut -d ' ' -f 1 "${{ steps.apk.outputs.file }}.sha256")
          gh release create "$TAG" --prerelease \
            --title "MTM App ${TAG}" \
            --notes "CI build of ${GITHUB_SHA} (branch ${GITHUB_REF_NAME}). SHA-256: ${SHA256}" \
            --target "${GITHUB_SHA}" || true
          gh release upload "$TAG" \
            "${{ steps.apk.outputs.file }}" \
            "${{ steps.apk.outputs.file }}.sha256" \
            --clobber
